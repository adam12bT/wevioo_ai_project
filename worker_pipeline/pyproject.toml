[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rfp-pipeline-worker"
version = "0.3.0"
description = "Durable Celery worker with PostgreSQL and Supabase providers"
requires-python = ">=3.11"
dependencies = [
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.9,<1",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
  "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
