name: CI/CD - Worker Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: worker-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate worker service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install .

      - name: Check Python source
        run: python -m compileall -q app worker.py

      - name: Build Docker image
        run: docker build --tag rfp-pipeline-worker:ci .

  deploy:
    name: Deploy to Hugging Face Space
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          test -n "$HF_TOKEN" || { echo "Missing HF_TOKEN secret"; exit 1; }
          test -n "$HF_USERNAME" || { echo "Missing HF_USERNAME secret"; exit 1; }
          test -n "$HF_SPACE_NAME" || { echo "Missing HF_SPACE_NAME secret"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add space "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}"
          git push --force space HEAD:main
